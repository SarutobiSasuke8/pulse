name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json was written by npm 11. npm 10 (bundled with Node 22)
      # misreads an optional peer (ajv) and refuses `npm ci`.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        timeout-minutes: 1
      # build:dev only. `npm run build` also runs db:migrate, which must not run in CI.
      - run: npm run build:dev
